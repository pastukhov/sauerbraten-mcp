[project]
name = "sauer-mcp"
version = "0.1.0"
description = "Local MCP tools for the live Cube2 level editor"
license = "Zlib"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "pillow>=11"]

[project.scripts]
sauer-mcp = "sauer_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sauer_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: runs a private live editor client", "native: runs initialized native engine cases"]
